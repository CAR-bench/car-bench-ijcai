# Local Docker full test-set scenario for the Track 2 Cerebras agent under test.
# Generate with:
#   uv run python generate_compose.py --scenario scenarios/track_2_agent_under_test_cerebras/local_docker_test_set.toml

[evaluator]
image = "ghcr.io/car-bench/car-bench-evaluator:latest"
env = { GEMINI_API_KEY = "${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}", LOGURU_LEVEL = "${LOGURU_LEVEL:-INFO}" }

[agent_under_test]
name = "track2-baseline-cerebras-gpt-oss-120b"
result_label = "Track 2 baseline — Cerebras gpt-oss-120b provider defaults"
result_model = "gpt-oss-120b"
result_reasoning_effort = "provider-default-medium"
build = { context = ".", dockerfile = "src/track_2_agent_under_test_cerebras/Dockerfile.track-2-agent-under-test-cerebras" }
env = { CEREBRAS_API_KEY = "${CEREBRAS_API_KEY:?Set CEREBRAS_API_KEY in .env}", TRACK2_CEREBRAS_QUEUE_BACKOFF_SECONDS = "${TRACK2_CEREBRAS_QUEUE_BACKOFF_SECONDS:-60}", TRACK2_CEREBRAS_QUEUE_BACKOFF_INITIAL_JITTER_RATIO = "${TRACK2_CEREBRAS_QUEUE_BACKOFF_INITIAL_JITTER_RATIO:-0.1}", TRACK2_CEREBRAS_QUEUE_BACKOFF_SECOND_MIN_SECONDS = "${TRACK2_CEREBRAS_QUEUE_BACKOFF_SECOND_MIN_SECONDS:-90}", TRACK2_CEREBRAS_QUEUE_BACKOFF_SECOND_MAX_SECONDS = "${TRACK2_CEREBRAS_QUEUE_BACKOFF_SECOND_MAX_SECONDS:-120}", TRACK2_CEREBRAS_QUEUE_BACKOFF_CAP_MIN_SECONDS = "${TRACK2_CEREBRAS_QUEUE_BACKOFF_CAP_MIN_SECONDS:-180}", TRACK2_CEREBRAS_QUEUE_BACKOFF_CAP_MAX_SECONDS = "${TRACK2_CEREBRAS_QUEUE_BACKOFF_CAP_MAX_SECONDS:-300}", TRACK2_CEREBRAS_RATE_LIMIT_RETRY_BUFFER_SECONDS = "${TRACK2_CEREBRAS_RATE_LIMIT_RETRY_BUFFER_SECONDS:-1}", CAR_BENCH_CEREBRAS_RATE_LIMIT_REPORT_DIR = "${CAR_BENCH_CEREBRAS_RATE_LIMIT_REPORT_DIR:-/tmp/car-bench-rate-limit-reports}", TRACK2_LLM_MALFORMED_RETRIES = "${TRACK2_LLM_MALFORMED_RETRIES:-1}", LOGURU_LEVEL = "${LOGURU_LEVEL:-INFO}" }

[config]
num_trials = 3
task_split = "test"
tasks_base_num_tasks = -1
tasks_hallucination_num_tasks = -1
tasks_disambiguation_num_tasks = -1
max_steps = 50
