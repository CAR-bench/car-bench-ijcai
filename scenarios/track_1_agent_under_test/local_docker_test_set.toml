# Local Docker full test-set scenario for the baseline LiteLLM agent under test.
# Generate with:
#   uv run python generate_compose.py --scenario scenarios/track_1_agent_under_test/local_docker_test_set.toml

[evaluator]
image = "ghcr.io/car-bench/car-bench-evaluator:latest"
env = { GEMINI_API_KEY = "${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}", LOGURU_LEVEL = "${LOGURU_LEVEL:-INFO}" }

[agent_under_test]
name = "track1-baseline-gpt-5.6-sol"
result_label = "Track 1 baseline — gpt-5.6-sol Chat Completions"
result_model = "gpt-5.6-sol"
build = { context = ".", dockerfile = "src/track_1_agent_under_test/Dockerfile.track-1-agent-under-test" }
env = { OPENAI_API_KEY = "${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}", LOGURU_LEVEL = "${LOGURU_LEVEL:-INFO}" }

[config]
num_trials = 3
task_split = "test"
tasks_base_num_tasks = -1
tasks_hallucination_num_tasks = -1
tasks_disambiguation_num_tasks = -1
max_steps = 50
